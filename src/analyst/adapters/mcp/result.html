<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analyst result</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#6b7280; --line:#e5e7eb; --head:#f3f4f6; --accent:#2563eb; --warn:#b45309; }
  :root[data-theme="dark"] { --bg:#1e1e1e; --fg:#e5e7eb; --muted:#9ca3af; --line:#3a3a3a; --head:#2a2a2a; --accent:#60a5fa; --warn:#fbbf24; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1e1e1e; --fg:#e5e7eb; --muted:#9ca3af; --line:#3a3a3a; --head:#2a2a2a; --accent:#60a5fa; --warn:#fbbf24; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px system-ui,sans-serif; }
  #answer, #state { padding:8px 10px; white-space:pre-wrap; }
  #state { border-left:3px solid var(--accent); margin:8px 10px; background:var(--head); }
  #sqlbox { margin:0 10px 8px; color:var(--muted); }
  #sqlbox pre { margin:4px 0 0; padding:6px 8px; background:var(--head); overflow:auto; max-height:140px; font:12px ui-monospace,monospace; }
  #notice { padding:4px 10px; color:var(--warn); }
  #bar { display:flex; gap:12px; padding:6px 10px; color:var(--muted); border-bottom:1px solid var(--line); }
  #status { margin-left:auto; }
  #wrap { max-height:420px; overflow:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:5px 10px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--line); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  th { position:sticky; top:0; background:var(--head); cursor:pointer; user-select:none; }
  th.sorted { color:var(--accent); }
  th.num { text-align:right; }
  #answer code { font:12px ui-monospace,monospace; background:var(--head); padding:0 3px; border-radius:3px; }
  #actions { padding:0 10px 8px; }
  #actions button { padding:4px 14px; font:inherit; color:var(--fg); background:var(--head); border:1px solid var(--line); border-radius:4px; cursor:pointer; }
  #actions button:disabled { opacity:.5; cursor:default; }
  [hidden] { display:none; }
</style></head>
<body>
<div id="answer" hidden></div>
<div id="state" hidden></div>
<details id="sqlbox" hidden><summary>SQL</summary><pre id="sql"></pre></details>
<div id="actions" hidden><button id="approve">Approve</button> <button id="reject">Reject</button></div>
<div id="notice" hidden></div>
<div id="bar"><span id="count">waiting for result…</span><span id="status">no host yet</span></div>
<div id="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
<script>
let nextId = 1; const pending = new Map();
const $ = id => document.getElementById(id);
const send = m => window.parent.postMessage(m, "*");
const request = (method, params) => new Promise(res => {
  const id = nextId++; pending.set(id, res); send({ jsonrpc: "2.0", id, method, params });
});
function applyTheme(ctx) { if (ctx && ctx.theme) document.documentElement.dataset.theme = ctx.theme; }
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
// The table and SQL box already show the query and its rows, so the answer
// text drops fenced code and markdown tables, and keeps bold / inline code.
function prose(text) {
  const clean = String(text || "").replace(/```[\s\S]*?```/g, "")
    .split("\n").filter(l => !/^\s*\|/.test(l)).join("\n").replace(/\n{3,}/g, "\n\n").trim();
  return esc(clean).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
}
const fmt = v => typeof v !== "number" ? esc(v)
  : Number.isInteger(v) ? v.toLocaleString("en-US")
  : v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 4 });
function show(id, text) { const el = $(id); el.textContent = text || ""; el.hidden = !text; }

let columns = [], rows = [], sortCol = -1, sortDir = 1, currentRun = null;
function render() {
  const numeric = columns.map((_, i) => rows.some(r => r[i] !== null && r[i] !== undefined) &&
    rows.every(r => r[i] === null || r[i] === undefined || typeof r[i] === "number"));
  $("head").innerHTML = "<tr>" + columns.map((c, i) =>
    `<th data-i="${i}" class="${(i === sortCol ? "sorted " : "") + (numeric[i] ? "num" : "")}">${esc(c)}${i === sortCol ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr>";
  const view = rows.slice();
  if (sortCol >= 0) view.sort((a, b) => {
    const x = a[sortCol], y = b[sortCol];
    if (x === y) return 0;
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * sortDir;
  });
  $("body").innerHTML = view.map(r => "<tr>" + r.map(v =>
    `<td class="${typeof v === "number" ? "num" : ""}">${v === null || v === undefined ? "" : fmt(v)}</td>`).join("") + "</tr>").join("");
  $("count").textContent = `${rows.length} row${rows.length === 1 ? "" : "s"}`;
}
$("head").addEventListener("click", e => {
  const th = e.target.closest("th"); if (!th) return;
  const i = +th.dataset.i; sortDir = (i === sortCol) ? -sortDir : 1; sortCol = i; render();
});

function showResult(r) {
  columns = r.columns || []; rows = r.rows || []; sortCol = -1; sortDir = 1;
  show("answer", ""); show("state", ""); show("notice", "");
  $("actions").hidden = true; currentRun = null;
  $("sqlbox").hidden = true;
  if (r.status === "needs_input") show("state", r.question || "The analyst needs more information.");
  else if (r.status === "needs_approval") {
    show("state", "Waiting for your approval to run this write on the scratch copy:\n" + (r.sql || ""));
    currentRun = r.run_id; $("actions").hidden = false;
  }
  else if (r.status === "error") show("state", r.message || "Something went wrong.");
  else {
    const a = $("answer"); a.innerHTML = prose(r.answer); a.hidden = !a.textContent.trim();
    if (r.sql) { $("sql").textContent = r.sql; $("sqlbox").hidden = false; }
    if (r.rows_truncated) show("notice", `Result capped at ${rows.length} rows; the query returns more.`);
    else if (r.write) show("notice", "Write: " + r.write);
  }
  render();
  $("count").textContent = columns.length ? $("count").textContent : "";
}

async function decide(approve) {
  const run = currentRun, sql = $("state").textContent;
  $("approve").disabled = $("reject").disabled = true;
  const r = await request("tools/call", { name: "approve_write", arguments: { run_id: run, approve } });
  const sc = r.result && r.result.structuredContent;
  if (sc && sc.status) { showResult(sc); return; }
  const why = (r.error && r.error.message) || "no result";
  show("state", `Could not send your decision (${why}). The write was not run.\n` + sql);
  $("approve").disabled = $("reject").disabled = false;
}
$("approve").addEventListener("click", () => decide(true));
$("reject").addEventListener("click", () => decide(false));

window.addEventListener("message", e => {
  const m = e.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id !== undefined && !m.method) { const cb = pending.get(m.id); pending.delete(m.id); if (cb) cb(m); return; }
  if (m.method === "ui/notifications/tool-result") {
    const sc = (m.params || {}).structuredContent;
    if (sc && sc.status) { showResult(sc); $("status").textContent = "host: result received"; }
    else $("count").textContent = "result had no structuredContent";
  } else if (m.method === "ui/notifications/host-context-changed") applyTheme(m.params);
  if (m.id !== undefined && m.method) send({ jsonrpc: "2.0", id: m.id, result: {} });
});

(async () => {
  if (window.parent === window) { $("status").textContent = "not inside a host (standalone)"; return; }
  const timer = setTimeout(() => { $("status").textContent = "host did not answer ui/initialize"; }, 4000);
  const r = await request("ui/initialize", {
    protocolVersion: "2026-01-26", appCapabilities: {}, capabilities: {},
    clientInfo: { name: "analyst-result", version: "1" } });
  clearTimeout(timer);
  const info = (r.result && r.result.hostInfo) || {};
  $("status").textContent = "host: " + (info.name || "connected");
  applyTheme(r.result && r.result.hostContext);
  send({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
})();
</script></body></html>
