[project]
name = "analyst"
version = "0.1.0"
description = "Data Analyst Agent over the Olist marketplace data"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pyyaml>=6",
    "langfuse>=3",
    "chainlit>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "sqlglot>=26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that need live services (compose Postgres, Langfuse)",
]
