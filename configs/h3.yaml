# H3: H2 plus SQL checks in the loop (explain before run, result flags,
# 2-retry limit on consecutive SQL failures).
model: qwen3.8-27b
base_url: http://localhost:8080/v1
api_key: ${ANALYST_API_KEY}
run_name: h3
max_steps: 12
max_total_tokens: 20000
context_window: 32000
db_path: data/olist.sqlite
scratch_path: data/scratch.sqlite
row_limit: 200
timeout_s: 10
rag: true
rag_index: data/rag_index.json
sql_checks: true
clarify: false
